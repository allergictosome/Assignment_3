<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Author Network Visualization</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body { margin: 0; }
        svg { background-color: #f0f0f0; }
        .node { stroke: #fff; stroke-width: 1.5px; }
        .link { stroke: #999; stroke-opacity: 0.6; }
        .label { font: 10px sans-serif; pointer-events: none; }
        #tooltip {
            position: absolute;
            background: white;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            pointer-events: none;
            display: none;
        }
    </style>
</head>
<body>
    <div id="tooltip"></div>
    <script>
        const width = window.innerWidth;
        const height = window.innerHeight;

        const svg = d3.select("body").append("svg")
            .attr("width", width)
            .attr("height", height)
            .call(d3.zoom().on("zoom", (event) => {
                g.attr("transform", event.transform);
            }));

        const g = svg.append("g");

        d3.json("network.json").then(data => {
            const nodes = data.nodes;
            const links = data.links;
            const topCountries = data.top_countries;

            // Color scale for top 10 countries
            const color = d3.scaleOrdinal()
                .domain(topCountries)
                .range(d3.schemeCategory10);
            const defaultColor = "#999";  // Gray for others

            // Size scale for nodes (based on degree)
            const size = d3.scaleLinear()
                .domain([0, d3.max(nodes, d => d.degree)])
                .range([5, 20]);

            // Link thickness scale (based on value)
            const linkWidth = d3.scaleLinear()
                .domain([1, d3.max(links, d => d.value)])
                .range([1, 10]);

            const simulation = d3.forceSimulation(nodes)
                .force("link", d3.forceLink(links).id(d => d.id).distance(100).strength(0.5))
                .force("charge", d3.forceManyBody().strength(-200))
                .force("center", d3.forceCenter(width / 2, height / 2))
                .force("collide", d3.forceCollide().radius(d => size(d.degree) + 2));

            // Draw links
            const link = g.append("g")
                .selectAll("line")
                .data(links)
                .enter().append("line")
                .attr("class", "link")
                .attr("stroke-width", d => linkWidth(d.value));

            // Draw nodes
            const node = g.append("g")
                .selectAll("circle")
                .data(nodes)
                .enter().append("circle")
                .attr("class", "node")
                .attr("r", d => size(d.degree))
                .attr("fill", d => topCountries.includes(d.country) ? color(d.country) : defaultColor)
                .call(d3.drag()
                    .on("start", dragstarted)
                    .on("drag", dragged)
                    .on("end", dragended))
                .on("mouseover", mouseover)
                .on("mouseout", mouseout);

            // Node labels (only for degree > 5)
            const label = g.append("g")
                .selectAll("text")
                .data(nodes.filter(d => d.degree > 5))
                .enter().append("text")
                .attr("class", "label")
                .text(d => d.name);

            simulation.on("tick", () => {
                link
                    .attr("x1", d => d.source.x)
                    .attr("y1", d => d.source.y)
                    .attr("x2", d => d.target.x)
                    .attr("y2", d => d.target.y);

                node
                    .attr("cx", d => d.x)
                    .attr("cy", d => d.y);

                label
                    .attr("x", d => d.x + 5)
                    .attr("y", d => d.y + 3);
            });

            function dragstarted(event, d) {
                if (!event.active) simulation.alphaTarget(0.3).restart();
                d.fx = d.x;
                d.fy = d.y;
            }

            function dragged(event, d) {
                d.fx = event.x;
                d.fy = event.y;
            }

            function dragended(event, d) {
                if (!event.active) simulation.alphaTarget(0);
                d.fx = null;
                d.fy = null;
            }

            const tooltip = d3.select("#tooltip");
            function mouseover(event, d) {
                tooltip
                    .style("display", "block")
                    .style("left", `${event.pageX + 10}px`)
                    .style("top", `${event.pageY + 10}px`)
                    .html(`<strong>Name:</strong> ${d.name}<br>
                           <strong>Affiliation:</strong> ${d.affiliation}<br>
                           <strong>Country:</strong> ${d.country}<br>
                           <strong>Degree:</strong> ${d.degree}`);
            }

            function mouseout() {
                tooltip.style("display", "none");
            }
        });
    </script>
</body>
</html>
